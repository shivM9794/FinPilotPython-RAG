
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinPilot AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, sans-serif;
      background: #f3f6fb; color: #172b3a;
    }
    header {
      background: #153b50; color: white;
      padding: 20px; text-align: center;
    }
    header h1 { margin: 0 0 6px; }
    header p { margin: 0; color: #d5e5ee; }
    main { max-width: 760px; margin: 24px auto; padding: 16px; }
    #chat {
      min-height: 300px; display: flex; flex-direction: column;
      gap: 16px; margin-bottom: 20px;
    }
    .message {
      padding: 16px; border-radius: 14px;
      line-height: 1.6; white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .user { background: #dceafb; align-self: flex-end; max-width: 90%; }
    .assistant {
      background: white; border: 1px solid #dce4ec;
      align-self: stretch;
    }
    .label { font-size: 12px; color: #63788a; margin-bottom: 6px; }
    form { display: flex; gap: 8px; }
    input {
      flex: 1; min-width: 0; padding: 15px;
      border: 1px solid #cbd5df; border-radius: 12px; font-size: 16px;
    }
    button {
      padding: 14px 18px; border: 0; border-radius: 12px;
      background: #167d9a; color: white; font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    .hint { font-size: 13px; color: #63788a; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>FinPilot AI</h1>
    <p>Your intelligent finance assistant</p>
  </header>
  <main>
    <div id="chat">
      <div class="message assistant">
        Welcome to FinPilot AI! Ask a question about your uploaded finance documents.
      </div>
    </div>
    <form id="question-form">
      <input id="question" placeholder="Ask about your documents..." required>
      <button id="send" type="submit">Send</button>
    </form>
    <p class="hint">Answers are based on documents uploaded to this session.</p>
  </main>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("question-form");
    const input = document.getElementById("question");
    const send = document.getElementById("send");

    function addMessage(label, text, type) {
      const wrapper = document.createElement("div");
      const heading = document.createElement("div");
      const content = document.createElement("div");
      wrapper.className = "message " + type;
      heading.className = "label";
      heading.textContent = label;
      content.textContent = text;
      wrapper.append(heading, content);
      chat.appendChild(wrapper);
      wrapper.scrollIntoView({ behavior: "smooth", block: "end" });
      return content;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      addMessage("YOU", question, "user");
      input.value = "";
      send.disabled = true;
      const answer = addMessage("FINPILOT AI", "Searching your documents...", "assistant");

      try {
        const response = await fetch("/api/v1/knowledge/search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user_id: "demo-user",
            question: question,
            top_k: 5
          })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "Search failed");

        if (data.results && data.results.length) {
          answer.textContent = data.results.map((item, index) =>
            `Source ${index + 1}: ${item.filename}\n\n${item.text}`
          ).join("\n\n----------------\n\n");
        } else {
          answer.textContent = "No matching documents found. Upload your document first, then try again.";
        }
      } catch (error) {
        answer.textContent = "Could not search documents. Please check that the FinPilot server is running.";
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
